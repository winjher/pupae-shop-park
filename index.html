<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b3fd0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LepVision Butterfly Marketplace</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --b1:#5b3fd0;--b2:#9b4fe0;--pk:#ec4899;
  --bg:#f5f3fb;--sf:#ffffff;--ink:#1d1a33;--ink2:#5d5878;--mut:#8b87a6;--ln:#ebe7f5;
  --ok:#047857;--okbg:#d1fae5;--wr:#b45309;--wrbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;
  --inf:#4338ca;--infbg:#e0e7ff;--r:18px;
  --sh:0 1px 2px rgba(30,20,70,.05),0 10px 30px rgba(60,40,120,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.hide{display:none!important}
.app{max-width:980px;margin:0 auto}
.muted{color:var(--mut);font-size:.84rem}
.note{color:var(--bad);font-size:.86rem;min-height:1.2em;margin:6px 0}
.ok{color:var(--ok);font-size:.86rem;font-weight:600;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.h4{font-weight:800;margin:16px 0 8px;font-size:.92rem;color:var(--b1)}

/* ---------- HERO ---------- */
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#4a2fc0 0%,#7b3fe4 55%,#c05ad8 100%);padding:calc(18px + env(safe-area-inset-top,0px)) 20px 74px;border-radius:0 0 34px 34px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.hero:before{width:260px;height:260px;right:-80px;top:-110px}
.hero:after{width:180px;height:180px;left:-60px;bottom:-110px}
.hero-in{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero small{opacity:.85;font-size:.8rem;font-weight:600}
.hero h1{margin:2px 0 0;font-size:1.45rem;font-weight:800;letter-spacing:-.3px}
.pill{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:999px;font-size:.74rem;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#6ee7b7;animation:pulse 2s infinite}
.pill.off .dot{background:#fca5a5;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(110,231,183,0)}100%{box-shadow:0 0 0 0 rgba(110,231,183,0)}}
.iconbtn{background:rgba(255,255,255,.2);color:#fff;border-radius:14px;padding:9px 14px;font-weight:700;box-shadow:none}
.iconbtn:hover{background:rgba(255,255,255,.3)}
.iconbtn.dark{background:#f1edfc;color:var(--b1)}

/* ---------- LAYOUT ---------- */
.main{padding:0 14px;margin-top:-46px;position:relative;z-index:2}
.card{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px;border:1px solid rgba(255,255,255,.7)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:1.02rem;font-weight:800;letter-spacing:-.1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--sf);border-radius:16px;padding:14px 8px;text-align:center;box-shadow:var(--sh);border-top:3px solid var(--b2)}
.stat:nth-child(2){border-top-color:var(--pk)}
.stat:nth-child(3){border-top-color:var(--ok)}
.stat b{display:block;font-size:1.35rem;font-weight:800}
.stat span{font-size:.72rem;color:var(--mut);font-weight:700}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.qbtn{background:#f7f5fd;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;font-size:.8rem}
.qbtn span{font-size:1.4rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);vertical-align:top}
th{color:var(--mut);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.4px}
.li{padding:12px 0;border-bottom:1px solid var(--ln);font-size:.9rem}
.li:last-child{border-bottom:0}
.empty{text-align:center;padding:26px 12px;color:var(--mut);font-size:.9rem}
.empty i{font-style:normal;font-size:2.2rem;display:block;margin-bottom:6px}

/* ---------- FORM CONTROLS ---------- */
button{font:inherit;border:0;cursor:pointer;border-radius:12px;padding:10px 16px;font-weight:700;background:#f1edfc;color:var(--b1);transition:transform .08s,filter .15s,background .15s}
button:hover{filter:brightness(1.03)}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn{background:linear-gradient(90deg,var(--b1),var(--b2));color:#fff;box-shadow:0 6px 16px rgba(91,63,208,.25)}
.btn.block{width:100%;padding:13px;display:block}
.btn.sm,.ghost.sm{padding:7px 12px;font-size:.8rem}
.ghost{background:#f1edfc;color:var(--b1)}
.ghost.danger{background:var(--badbg);color:var(--bad)}
.btn.sm{box-shadow:none}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;background:#fff;color:var(--ink);margin-top:5px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--b2);box-shadow:0 0 0 3px rgba(155,79,224,.18)}
input[type=checkbox],input[type=radio]{width:auto;margin:3px 0 0}
label.f{display:block;font-size:.78rem;font-weight:700;color:var(--ink2);margin-bottom:12px;letter-spacing:.2px}
label.cb{display:flex;gap:9px;align-items:flex-start;font-weight:600;color:var(--ink);font-size:.9rem;margin-bottom:8px}
.seg{display:flex;background:#f1edfc;border-radius:14px;padding:4px;margin-bottom:14px;gap:4px}
.seg button{flex:1;background:none;color:var(--mut);box-shadow:none;padding:9px}
.seg button.on{background:#fff;color:var(--b1);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 14px}
.slot{background:#fff;color:var(--ink);border:1px solid var(--ln);text-align:left;padding:10px 12px;font-size:.82rem}
.slot.on{background:linear-gradient(90deg,var(--b1),var(--b2));color:#fff;border-color:transparent}
.slot:disabled{background:#faf9fd;color:#b9b4cc}

/* ---------- BADGES & ALERTS ---------- */
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.7rem;font-weight:700;background:#eef0f5;color:#4b5563;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--wrbg);color:var(--wr)}
.chip.info{background:var(--infbg);color:var(--inf)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.badge{display:inline-block;font-size:.6rem;padding:3px 8px;border-radius:999px;background:var(--bad);color:#fff;font-weight:800;letter-spacing:.4px}
.badge.g{background:var(--ok)}
.alert{border-left:4px solid var(--wr);background:#fffbeb;padding:11px 13px;border-radius:12px;margin-bottom:9px;font-size:.88rem}
.alert.bad{border-color:var(--bad);background:#fff5f5}
.alert.ok{border-color:var(--ok);background:#f0fdf7}
.alert.info{border-color:var(--b2);background:#f7f4ff}

/* ---------- SPECIES GRID ---------- */
.species{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px}
.sp{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 8px rgba(60,40,120,.05);transition:transform .2s,box-shadow .2s}
.sp:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.sp.flood{opacity:.6}
.art{display:flex;justify-content:space-around;align-items:center;background:linear-gradient(180deg,#faf8ff,#f2eefc);border-radius:14px;padding:8px 4px}
.art img{width:60px;height:60px;object-fit:cover;border-radius:12px}
.art figure{margin:0;text-align:center;font-size:.66rem;color:var(--mut);font-weight:700}
.price{font-weight:800;color:var(--b1);font-size:1.02rem}
.edit-box{background:#faf8ff;border-radius:14px;padding:10px 10px 2px;border:1px dashed #d9d0f5}
.edit-box label.f{margin-bottom:10px;font-size:.72rem}

/* ---------- NAV & SHEETS ---------- */
.nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:24px;padding:6px;box-shadow:0 14px 34px rgba(60,40,120,.2);z-index:50;border:1px solid rgba(255,255,255,.8)}
.nav button{flex:1;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;font-size:.68rem;font-weight:700;border-radius:16px;box-shadow:none}
.nav button .ic{font-size:1.2rem;line-height:1.1}
.nav button.on{color:var(--b1);background:#f0ebfd}
.modal{position:fixed;inset:0;background:rgba(20,10,50,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:200}
.sheet{background:#fff;width:100%;max-width:600px;max-height:88vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-h h3{margin:0;font-size:1.1rem;font-weight:800}
.thread{max-height:46vh;overflow-y:auto;background:#faf8ff;border-radius:14px;padding:10px}
.msg{background:#fff;border-radius:12px;padding:9px 11px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.msg small{color:var(--mut)}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#1d1a33;color:#fff;padding:11px 18px;border-radius:14px;z-index:300;font-size:.86rem;max-width:92%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:opacity .2s}
@media(min-width:700px){
  .nav{left:50%;right:auto;width:600px;margin-left:-300px}
  .modal{align-items:center}
  .sheet{border-radius:26px}
}
</style>
</head>
<body>

<div class="app">
  <header class="hero">
    <div class="hero-in">
      <div><small id="hGreet">Welcome</small><h1 id="hTitle">LepVision</h1></div>
      <button class="iconbtn hide" id="cartBtn" data-act="openCart">🛒 <span id="cartN">0</span></button>
    </div>
    <div class="pill" id="pill"><span class="dot"></span><span id="pillT">Connecting…</span></div>
  </header>

  <main class="main">
    <section id="vHome" data-view="home" class="hide"></section>
    <section id="vMarket" data-view="market" class="hide"></section>
    <section id="vPupae" data-view="pupae" class="hide"></section>
    <section id="vVisits" data-view="visits" class="hide"></section>
    <section id="vBookings" data-view="bookings" class="hide"></section>
    <section id="vMore" data-view="more" class="hide"></section>
  </main>
</div>

<nav class="nav hide" id="nav"></nav>

<div id="sheet" class="modal hide" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <div class="sheet-h"><h3 id="shT"></h3><button class="iconbtn dark" data-act="closeSheet">✕</button></div>
    <div id="shB"></div>
  </div>
</div>

<div id="toast" class="hide"></div>

<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
const IN_APPS_SCRIPT = !!(window.google && window.google.script && window.google.script.run);
const SERVER_FALLBACK_URL = 'https://script.google.com/macros/s/AKfycbyR3YOwNEhZmnoG94E27j3lJgqZ-KB7zBACPazkb-TGE2mFwq4OWFlmphGY1coU0G0aAw/exec';
const APPS_SCRIPT_URL = (function () {
  const tpl = '<?= ScriptApp.getService().getUrl() ?>';
  if (tpl && tpl.indexOf('https://') === 0) return tpl;
  if (IN_APPS_SCRIPT && location.href.indexOf('/exec') > -1) return location.href.split('?')[0];
  return SERVER_FALLBACK_URL;
})();
const LEGAL_URL = APPS_SCRIPT_URL + '?page=legal';
const TOUR_URL = APPS_SCRIPT_URL + '?page=tour';

/* =====================================================================
   STATIC DATA (must match Code.gs)
   ===================================================================== */
const SPECIES = {
  'Butterfly-Batwing':['#2b2b2b','#e9e4d0'],
  'Butterfly-Clippers':['#8a6d3b','#f2e3b3'],
  'Butterfly-Common Jay':['#2b2b2b','#6fd3c6'],
  'Butterfly-Common Lime':['#7a6a3a','#e7d85a'],
  'Butterfly-Common Mime':['#222','#fff'],
  'Butterfly-Common Mormon':['#222','#fff'],
  'Butterfly-Emerald Swallowtail':['#1b3a2a','#3ddc84'],
  'Butterfly-Giant Silk Moth':['#6b4f2a','#d9b77a'],
  'Butterfly-Golden Birdwing':['#111','#f5c518'],
  'Butterfly-Great Eggfly':['#2a2a55','#fff'],
  'Butterfly-Great Yellow Mormon':['#222','#f4e04d'],
  'Butterfly-Grey Glassy Tiger':['#444','#bcd4dc'],
  'Butterfly-Paper Kite':['#111','#fff'],
  'Butterfly-Pink Rose':['#222','#e84a7f'],
  'Butterfly-Plain Tiger':['#c8641e','#f1a24a'],
  'Butterfly-Red Lacewing':['#7a1010','#e53935'],
  'Butterfly-Scarlet Mormon':['#111','#d62020'],
  'Butterfly-Tailed Jay':['#1f2a1f','#9be37f']
};
const SP_KEYS = Object.keys(SPECIES);
const QA = [
  'Healthy and firm, no discoloration or mold',
  'No deformities or damage; cremaster intact',
  'Correct size and weight for the species',
  'Not yet matured (freshly pupated, within 2 days)'
];
const ID_TYPES = ['Passport',"Driver's license",'PhilSys ID','UMID','Postal ID','SSS','Employee ID','Student ID'];
const SLOTS = ['09:00 AM - 11:00 AM','11:00 AM - 01:00 PM','01:00 PM - 03:00 PM','03:00 PM - 05:00 PM'];
const ROLE_LIST = ['purchaser','buyer','breeder','enthusiast','farmowner','admin'];
const ROLE_NAME = {purchaser:'Purchaser',buyer:'Buyer',breeder:'Breeder',enthusiast:'Visitor',farmowner:'Farm owner',admin:'Administrator'};
const CLS_TASKS = [
  {v:'species',t:'Species identification'},{v:'stage',t:'Lifecycle stage'},{v:'disease',t:'Larval disease'},
  {v:'instar',t:'Larvae instar'},{v:'defect',t:'Pupae defect'},{v:'sex',t:'Gender (sexing)'}
];
const PAID = 'Paid – Awaiting Receipt';
const ACTIVE_RES = ['Awaiting Approval','Pending Payment','Payment Submitted'];
const CHIP = {
  'Awaiting Approval':'info','Pending Payment':'warn','Payment Submitted':'info','Confirmed':'ok',
  'Rejected':'bad','Cancelled':'bad','Awaiting Payment':'warn',[PAID]:'info','Received':'ok'
};
const NAV = {
  home:['🏠','Home'], market:['🛍','Market'], pupae:['🐛','Pupae'],
  visits:['🎫','Visits'], bookings:['📋','Bookings'], more:['☰','More']
};
const STD = ['Tropical butterflies','Educational tours','Photography sessions'];
const FSTD = (loc, tel, ll, h = '8:00 AM - 5:00 PM', sp = STD) => ({loc, tel, h, ll, sp});
const FARM_INFO = {
  'JCM Butterfly Breeding Farm': FSTD('Cawit, Boac, Marinduque','0927 976 3905',[16.4023,120.5960]),
  'JMC Butterfly Farm': FSTD('Dawis, Gasan, Marinduque','0927 976 3905',[13.4,121.9]),
  'La Anton Insects & Butterfly Farm': FSTD('Cawit, Boac, Marinduque','0927 976 3905',[13.3837773,121.8396811]),
  "Lorica's Butterfly Breeding Farm": FSTD('Bunganay, Boac, Marinduque','+63 927 923 4527',[13.391627752131035,121.83732779599431]),
  'Lyra-Ysabelle Butterfly': FSTD('Cawit, Boac, Marinduque','(042) 754 5380',[13.380662651692896,121.82747508250148]),
  'Marl Insects Farm': FSTD('Caganhao, Boac, Marinduque','+63 918 128 4360',[13.402601213675057,121.82643398620317]),
  'Saluciana Integrated and Butterfly Farm': FSTD('Sta. Cruz, Marinduque','+63 915 123 4269',[13.43847474827148,122.0971865954574]),
  'Butterfly Paradise Farm': FSTD('Baguio City','+63 917 123 4567',[16.4023,120.5960]),
  'Rainbow Wings Sanctuary': FSTD('Tagaytay','+63 918 234 5678',[14.1059,120.9627],'9:00 AM - 4:00 PM',['Conservation education','Native species','Research tours']),
  'Monarch Breeding Center': FSTD('Los Baños, Laguna','+63 919 345 6789',[14.1693,121.2376],'10:00 AM - 3:00 PM (By appointment)',['Research tours','Breeding techniques','Student programs'])
};

/* =====================================================================
   STATE
   ===================================================================== */
let SESSION = '', me = '', dashToken = '';
let MEDIA = {};
let S = blankState();
const UI = {
  view:'home', cat:'', edit:false, bFarm:'', bFilter:'active', aFarm:'',
  visit:{farm:'', date:'', n:1, slot:''}, cart:{}, qty:{}, users:[], threadRef:'', sheetKind:''
};
let pollTimer = null, chartRef = null, camStream = null;

function blankState(){
  return {users:{},catalog:{},farms:{},capRules:{},booked:{},park:{gName:'',gNo:'',closed:[]},
          lots:[],orders:[],reservations:[],salesRecord:[],survey:{done:true,items:[]},species:[],today:''};
}

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s[0].toUpperCase() + s.slice(1);
const pname = s => String(s).replace(/^Butterfly-/, '');
const money = n => '₱' + Number(n || 0).toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = n => ymd(new Date(Date.now() + n * 864e5));
const todayStr = () => S.today || ymd(new Date());
const errText = e => (e && e.message) ? e.message : String(e);
const fmt = t => { const d = new Date(t); return isNaN(d) ? '' : d.toLocaleString('en-PH', {dateStyle:'medium', timeStyle:'short'}); };
const timeLeft = t => { const m = t - Date.now(); if (m <= 0) return 'expired'; const h = Math.floor(m / 36e5); return `${Math.floor(h/24)}d ${h%24}h left`; };
const chip = st => `<span class="chip ${CHIP[st] || ''}">${esc(st)}</span>`;
const empty = (i, t) => `<div class="empty"><i>${i}</i>${t}</div>`;
const nameOf = u => (S.users[u] && S.users[u].name) || u;

function setMsg(el, text, type){
  if (!el) return;
  el.textContent = text;
  el.className = type === 'ok' ? 'ok' : type === 'info' ? 'muted' : 'note';
}
function toast(t){
  const e = $('toast'); e.textContent = t; e.classList.remove('hide');
  clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.add('hide'), 3000);
}

/* ----- role & permission helpers ----- */
const mine = () => S.users[me] || {};
const role = () => mine().role || '';
const isBuyer = () => ['buyer','purchaser'].includes(role());
const isBreeder = () => role() === 'breeder';
const isOwner = () => role() === 'farmowner';
const isAdmin = () => role() === 'admin';
const canBuy = () => me && ['buyer','purchaser','breeder'].includes(role());
const bFarm = () => isOwner() ? (mine().farm || '') : UI.bFarm;

function navFor(){
  if (!me) return ['home','more'];
  switch (role()) {
    case 'farmowner': return ['home','bookings','more'];
    case 'admin': return ['home','market','bookings','more'];
    case 'enthusiast': return ['home','visits','more'];
    default: return ['home','market','pupae','visits','more'];
  }
}

/* ----- catalog & farm helpers ----- */
const farmNames = () => Object.keys(S.farms || {}).sort();
const flooded = (b, sp) => !!(((S.catalog[b] || {})[sp]) || {}).flooded;
const priceOf = (b, sp) => { const e = (S.catalog[b] || {})[sp]; return e && e.price != null ? e.price : 50; };
const lotOpen = l => l.left > 0 && Date.now() < l.exp && !flooded(l.breeder, l.sp);
const mediaUrl = (sp, kind) => MEDIA[sp + '|' + kind] || '';

function farmInfo(n){
  const b = FARM_INFO[n] || {}, s = (S.farms || {})[n] || {};
  const ll = (s.lat != null && s.lng != null) ? [s.lat, s.lng] : (b.ll || [13.4, 121.9]);
  return {
    loc: s.loc || b.loc || '', tel: s.tel || b.tel || '', h: s.hours || b.h || '',
    sp: (s.sp && s.sp.length) ? s.sp : (b.sp || []),
    p: s.p != null ? s.p : 150, c: s.c != null ? s.c : 20, ll
  };
}
function capOn(f, d){
  let c = farmInfo(f).c;
  ((S.capRules || {})[f] || []).forEach(r => { if (d >= r.from && d <= r.to) c = r.cap; });
  return c;
}

/* =====================================================================
   SERVER RPC (Apps Script google.script.run, or fetch when hosted elsewhere)
   ===================================================================== */
function rpc(fn, ...args){
  if (IN_APPS_SCRIPT) {
    return new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...args));
  }
  return fetch(APPS_SCRIPT_URL, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({fn: fn, args: args})
  })
    .then(r => { if (!r.ok) throw new Error('Server returned HTTP ' + r.status + '. Check the deployment is active and set to Anyone.'); return r.text(); })
    .then(t => {
      let j;
      try { j = JSON.parse(t); }
      catch (e) { throw new Error('The server returned a web page instead of data. Check the deployment access settings.'); }
      if (j.error) throw new Error(j.error);
      return j.result;
    })
    .catch(e => {
      if (e instanceof TypeError) throw new Error('Cannot reach the server from this browser. Open the app from its /exec link and try again.');
      throw e;
    });
}
/** Every authenticated call passes the session token as its first argument. */
const api = (fn, ...args) => rpc(fn, SESSION, ...args);

function saveSession(){
  try {
    sessionStorage.setItem('lvToken', SESSION);
    sessionStorage.setItem('lvUser', me);
    sessionStorage.setItem('lvDash', dashToken || '');
  } catch (e) {}
}
function clearSession(){
  SESSION = ''; me = ''; dashToken = ''; S = blankState();
  try { ['lvToken','lvUser','lvDash'].forEach(k => sessionStorage.removeItem(k)); } catch (e) {}
}
function setLive(ok){
  $('pill').classList.toggle('off', !ok);
  $('pillT').textContent = ok ? 'Live · synced ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : 'Offline – retrying';
}
function refresh(){
  if (!SESSION) { S = blankState(); return Promise.resolve(); }
  return api('getState')
    .then(st => { S = st; if (!S.users[me]) throw new Error('Please log in again.'); setLive(true); })
    .catch(e => {
      if (/log in again|expired/i.test(errText(e))) { clearSession(); toast('Please log in again.'); }
      else setLive(false);
    });
}
function startPolling(){
  if (pollTimer) return;
  pollTimer = setInterval(poll, 6000);
}
let pollBusy = false;

function uploadPhoto(sp, kind, file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 800 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      toast('Uploading photo…');
      api('saveMedia', sp + '|' + kind, c.toDataURL('image/jpeg', 0.85))
        .then(res => { MEDIA[sp + '|' + kind] = res.url; toast('Photo saved'); renderMarket(); })
        .catch(e => toast(errText(e)));
    };
    im.src = reader.result;
  };
  reader.readAsDataURL(file);
}

          : l.left > 0 ? `<span class="chip ok">For sale · ${timeLeft(l.exp)}</span>` : '<span class="chip">Sold out</span>';

        return `<tr><td>${esc(pname(l.sp))}</td><td>${l.left} / ${l.qty}</td><td>${money(l.price)}</td><td>${status}</td><td>${act}</td></tr>`;

      : empty('📦', 'No listings yet. Post your first batch above.');
    po.innerHTML = ordersHTML(S.orders.filter(o => o.breeder === me));
  } else {
    const open = S.lots.filter(lotOpen).sort((a, b) => b.created - a.created);
    pl.innerHTML = open.length ? open.map(lotCard).join('') : empty('🦋', 'No fresh pupae for sale right now. Check back soon.');

function ordersHTML(list){
  const L = [...list].sort((a, b) => b.created - a.created);
  if (!L.length) return empty('🧾', 'No orders yet.');
  return L.map(o => {
    const buyerSide = o.buyer === me, seller = S.users[o.breeder] || {};
    let act = '';
    if (buyerSide && o.status === 'Awaiting Payment') {
      act = `<div class="alert">💙 Send <b>${money(o.total)}</b> via GCash to <b>${esc(seller.gcash || 'the seller')}</b>, then enter the reference number.</div>
        <div class="row">
          <input id="pr_${esc(o.id)}" inputmode="numeric" placeholder="GCash reference no." class="grow" style="margin:0">
          <button class="btn sm" data-act="orderPay" data-id="${esc(o.id)}">I've paid</button>
          <button class="ghost sm danger" data-act="orderAct" data-id="${esc(o.id)}" data-do="cancel">Cancel</button>
        </div>`;
    } else if (buyerSide && o.status === PAID) {
      act = '<p class="muted">Payment submitted. Waiting for the seller to confirm receipt.</p>';
    } else if (!buyerSide && o.status === PAID) {
      act = `<button class="btn sm" data-act="orderAct" data-id="${esc(o.id)}" data-do="received">Payment received – mark complete</button>`;
    } else if (!buyerSide && o.status === 'Awaiting Payment') {
      act = `<button class="ghost sm danger" data-act="orderAct" data-id="${esc(o.id)}" data-do="cancel">Cancel order</button>`;
    }
    const contact = buyerSide
      ? `Seller: ${esc(o.sellerName || '')}${o.sellerPhone ? ' · ' + esc(o.sellerPhone) : ''}`
      : `Buyer: ${esc(o.buyerName || '')}${o.buyerPhone ? ' · ' + esc(o.buyerPhone) : ''}${o.buyerAddress ? '<br>📍 ' + esc(o.buyerAddress) : ''}`;
    return `<div class="li">
      <div class="row between"><b>${esc(o.id)}</b>${chip(o.status)}</div>
      <div>${esc(pname(o.sp))} × ${o.qty} · <b>${money(o.total)}</b></div>
      <div class="muted">${contact}${o.payRef ? ' · GCash ref ' + esc(o.payRef) : ''}</div>
      ${act ? `<div style="margin-top:8px">${act}</div>` : ''}
    </div>`;
  }).join('');
}

function renderVisitInfo(){
  const el = $('vInfo'); if (!el || !UI.visit.farm) return;
  const i = farmInfo(UI.visit.farm);
  el.innerHTML = `<div class="alert info">
    📍 ${esc(i.loc)} · <a href="https://www.google.com/maps?q=${i.ll[0]},${i.ll[1]}" target="_blank" rel="noopener">Map</a><br>

    ${i.sp.length ? '<br>🎯 ' + esc(i.sp.join(', ')) : ''}</div>`;
}
function updateSlots(){
  const box = $('vSlots'), total = $('vTotal'); if (!box) return;
  const f = UI.visit.farm, d = UI.visit.date, n = parseInt(UI.visit.n, 10) || 0;
  if (total) total.textContent = money(farmInfo(f).p * n);
  if (!f || !d) { box.innerHTML = '<span class="muted">Choose a farm and date to see availability.</span>'; return; }
  if (d <= todayStr()) { box.innerHTML = '<span class="note">Choose a date from tomorrow onward.</span>'; return; }
  if ((S.park.closed || []).includes(d) || capOn(f, d) <= 0) {
    box.innerHTML = '<span class="note">The farm is closed on this date. Please choose another.</span>';
    UI.visit.slot = ''; return;
  }
  box.innerHTML = SLOTS.map(s => {
    const left = capOn(f, d) - booked(f, d, s);
    const disabled = left <= 0 || n > left || n < 1;
    return `<button class="slot ${UI.visit.slot === s ? 'on' : ''}" ${disabled ? 'disabled' : ''} data-act="pickSlot" data-s="${esc(s)}">
      ${esc(s)}<br><small>${Math.max(left, 0)} seat(s) left</small></button>`;
  }).join('');
}

  const el = $('vList'); if (!el) return;

function renderBookingsLists(){
  const bl = $('bList'); if (!bl) return;
  const f = bFarm();
  let L = S.reservations.filter(r => !f || r.farm === f);
  if (UI.bFilter === 'active') L = L.filter(r => ACTIVE_RES.includes(r.status)).sort((a, b) => a.created - b.created);
  else if (UI.bFilter === 'confirmed') L = L.filter(r => r.status === 'Confirmed').sort((a, b) => a.date < b.date ? -1 : 1);
  else L = L.sort((a, b) => b.created - a.created);
  bl.innerHTML = L.length ? L.map(resCard).join('') : empty('📭', 'Nothing to show in this view.');
  if (!f) return;
  const rules = S.capRules[f] || [];
  const br = $('bRules');
  if (br) br.innerHTML = rules.length
    ? rules.map((r, i) => `<div class="li row between"><div><b>${esc(r.label || 'Seat rule')}</b>
        <div class="muted">${esc(r.from)} → ${esc(r.to)} · ${r.cap === 0 ? 'CLOSED' : r.cap + ' seats per slot'}</div></div>
        <button class="ghost sm danger" data-act="rmSeat" data-i="${i}">Remove</button></div>`).join('')
    : `<p class="muted">Using the default of ${farmInfo(f).c} seats per slot every day.</p>`;
  const g = $('bGrid');
  if (g) {
    const days = [...Array(14)].map((_, i) => addDays(i));
    g.innerHTML = `<table><thead><tr><th>Date</th>${SLOTS.map(s => `<th>${esc(s.split(' - ')[0])}</th>`).join('')}</tr></thead><tbody>
      ${days.map(d => {
        const c = capOn(f, d);
        return `<tr><td>${d}</td>${SLOTS.map(s => `<td>${c <= 0 ? '<span class="chip bad">closed</span>' : `${booked(f, d, s)} / ${c}`}</td>`).join('')}</tr>`;
      }).join('')}</tbody></table>`;
  }
}
function saveRules(f, rules){
  return api('setFarmCapacity', f, rules)
    .then(res => {
      const w = res.warnings || [];
      toast(w.length ? 'Saved. Over capacity on ' + w.slice(0, 3).join(', ') : 'Seat rules saved');
      return refresh();
    })
    .then(renderBookings)
    .catch(e => toast(errText(e)));
}

/* =====================================================================

   ===================================================================== */
function camOpen(){
  camClose();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return setMsg($('clsMsg'), 'This browser cannot open the camera. Use Upload instead.');
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false})
    .then(s => { camStream = s; const v = $('camV'); v.srcObject = s; v.play().catch(() => {}); $('camBox').classList.remove('hide'); })
    .catch(e => setMsg($('clsMsg'), 'Camera unavailable (' + (e.name || e.message) + '). Use Upload instead.'));
}
function camClose(){
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  const b = $('camBox'); if (b) b.classList.add('hide');
}
function camShot(){
  const v = $('camV');
  if (!v || !v.videoWidth) return toast('The camera is still starting.');
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  camClose();
  classify(c.toDataURL('image/jpeg', 0.92));
}
function toB64(dataUrl, maxSide = 1024){
  return new Promise((ok, no) => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, maxSide / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', 0.9).split(',')[1]);
    };
    im.onerror = () => no(new Error('Could not read that image.'));
    im.src = dataUrl;
  });
}
function classify(dataUrl){
  const m = $('clsMsg'), out = $('clsOut');
  setMsg(m, 'Analyzing… this can take up to a minute.', 'info');
  out.innerHTML = '';
  toB64(dataUrl)
    .then(b64 => api('classifyAndSave', {task:$('clsTask').value, image:b64, mime:'image/jpeg'}))
    .then(res => {
      setMsg(m, 'Analysis complete.', 'ok');
      out.innerHTML = `<div class="alert ${res.identified ? 'ok' : ''}">
        <b>${res.identified ? esc(res.label) : 'Not identified (saved as Unknown)'}</b> · confidence ${(res.confidence * 100).toFixed(1)}%<br>
        <a href="${esc(res.fileUrl)}" target="_blank" rel="noopener">View saved photo</a> ·
        <a href="${esc(res.folderUrl)}" target="_blank" rel="noopener">Open folder</a></div>`;
    })
    .catch(e => setMsg(m, errText(e)));
}

      <div class="g2">
        <label class="f">Role<select id="euRole">${ROLE_LIST.map(r => `<option value="${r}" ${r === u.role ? 'selected' : ''}>${esc(ROLE_NAME[r])}</option>`).join('')}</select></label>
        <label class="f">Farm<select id="euFarm"><option value="">— none —</option>${farmNames().map(f => `<option value="${esc(f)}" ${f === u.farm ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select></label>
      </div>
      <div class="g2">
        <label class="f">Full name<input id="euName" value="${esc(u.name)}"></label>
        <label class="f">Phone<input id="euPhone" value="${esc(u.phone)}"></label>
      </div>
      <div class="g2">
        <label class="f">Email<input id="euEmail" value="${esc(u.email)}"></label>
        <label class="f">Organization<input id="euOrg" value="${esc(u.organization)}"></label>
      </div>
      <label class="f">Address<input id="euAddr" value="${esc(u.address)}"></label>
      <label class="f">GCash number<input id="euGcash" value="${esc(u.gcash)}"></label>
      <label class="f">New temporary password (leave blank to keep)<input id="euPw" type="password" autocomplete="new-password"></label>
      <p class="note" id="euMsg"></p>
      <button class="btn block" data-act="saveUser" data-u="${esc(u.username)}">Save changes</button>`, 'user');
  },
  saveUser: ds => {
    const m = $('euMsg');
    const d = {
      username:ds.u, role:$('euRole').value, farm:$('euFarm').value, name:$('euName').value,
      phone:$('euPhone').value, email:$('euEmail').value, organization:$('euOrg').value,
      address:$('euAddr').value, gcash:$('euGcash').value, password:$('euPw').value
    };
    api('adminUpdateUser', d)
      .then(() => { toast('User updated'); closeSheet(); loadUsers(); })
      .catch(e => setMsg(m, errText(e)));
  },
  createOwner: () => {
    const m = $('foMsg');
    const d = {
      username:$('foUser').value.trim().toLowerCase(), password:$('foPass').value, farm:$('foFarm').value,
      name:$('foName').value.trim(), phone:$('foPhone').value.trim(), email:$('foEmail').value.trim()
    };
    api('adminCreateFarmOwner', d)
      .then(() => { setMsg(m, 'Farm owner created. Share the temporary password securely.', 'ok'); toast('Farm owner created'); renderMore(); })
      .catch(e => setMsg(m, errText(e)));
  },
  loadSurvey: () => {
    api('getSurveyResults').then(r => {
      $('svRes').innerHTML = `<p class="muted">${r.responses} response(s) · overall average <b>${r.overall == null ? '–' : r.overall}</b> / 5</p>
        <div class="tbl-wrap"><table><thead><tr><th>Characteristic</th><th>Average</th></tr></thead><tbody>
        ${r.characteristics.map(c => `<tr><td>${esc(c.name)}</td><td>${c.average == null ? '–' : c.average}</td></tr>`).join('')}
        </tbody></table></div>
        ${r.comments.length ? '<div class="h4">Recent comments</div>' + r.comments.map(c => `<div class="li">${esc(c)}</div>`).join('') : ''}`;
    }).catch(e => toast(errText(e)));
  },
  addClosed: () => {
    const d = $('psDate').value; if (!d) return;
    S.park.closed = [...new Set([...(S.park.closed || []), d])].sort();
    savePark();
  },
  rmClosed: ds => {
    S.park.closed = (S.park.closed || []).filter(x => x !== ds.d);
    savePark();
  },
  savePark: () => savePark(),
  dsStatus: () => {
    const box = $('dsOut'); box.innerHTML = '<p class="muted">Loading…</p>';
    api('datasetStatus').then(res => {
      box.innerHTML = Object.keys(res.dataset).map(k => {
        const t = res.dataset[k], labels = Object.keys(t.labels);
        return `<div class="li"><b>${esc(t.folder)}</b>${t.found ? '' : ' <span class="chip bad">folder not found</span>'}
          <div class="muted">${labels.length ? labels.map(l => esc(l) + ': ' + t.labels[l]).join(' · ') : 'No labels yet'}</div></div>`;
      }).join('');
    }).catch(e => { box.innerHTML = `<p class="note">${esc(errText(e))}</p>`; });
  },
  camOpen: () => camOpen(),
  camShot: () => camShot(),
  camClose: () => camClose()
};

const CHANGE = {
  setCat: (ds, el) => { UI.cat = el.value; UI.edit = false; renderMarket(); },
  qty: (ds, el) => { UI.qty[ds.i] = el.value; },
  catPrice: (ds, el) => saveCat(ds.sp, {price:parseFloat(el.value)}),
  catCost: (ds, el) => saveCat(ds.sp, {cost:parseFloat(el.value) || 0}),
  catFlood: (ds, el) => saveCat(ds.sp, {flooded:el.checked}),
  catPhoto: (ds, el) => uploadPhoto(ds.sp, ds.kind, el.files[0]),
  visitFarm: (ds, el) => { UI.visit.farm = el.value; UI.visit.slot = ''; renderVisitInfo(); updateSlots(); },
  visitDate: (ds, el) => { UI.visit.date = el.value; UI.visit.slot = ''; updateSlots(); },
  visitN: (ds, el) => { UI.visit.n = el.value; UI.visit.slot = ''; updateSlots(); },
  bFarm: (ds, el) => { UI.bFarm = el.value; renderBookings(); },
  aFarm: (ds, el) => { UI.aFarm = el.value; renderMore(); },
  regRole: () => regRoleChanged(),
  clsFile: (ds, el) => {
    const f = el.files[0]; el.value = '';
    if (!f) return;
    const r = new FileReader();
    r.onload = () => classify(r.result);
    r.readAsDataURL(f);
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  if (t.tagName === 'A') e.preventDefault();
  const fn = ACTIONS[t.dataset.act];
  if (fn) fn(t.dataset, t);
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-chg]');
  if (!t) return;
  const fn = CHANGE[t.dataset.chg];
  if (fn) fn(t.dataset, t);
});

/* =====================================================================
   BOOT
   ===================================================================== */
function boot(){
  try {
    SESSION = sessionStorage.getItem('lvToken') || '';
    me = sessionStorage.getItem('lvUser') || '';
    dashToken = sessionStorage.getItem('lvDash') || '';
  } catch (e) {}
  if (!SESSION) { me = ''; dashToken = ''; }
  rpc('getMedia').then(m => { MEDIA = m || {}; }).catch(() => {});
  refresh().then(() => {
    renderNav();
    showView('home');
    if (me) startPolling();
  });
}
boot();
</script>
</body>
</html>
