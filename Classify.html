<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Classification</title>
<style>
:root{--p1:#5b3fd0;--p2:#9b4fe0;--bg:#f3f0fc;--card:#fff;--text:#1e1b3a;--muted:#7a7599;--line:#e8e3f6;--ok:#10b981;--bad:#ef4444;--shadow:0 8px 24px rgba(60,40,120,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
header{background:linear-gradient(135deg,#4a2fc0,#c05ad8);color:#fff;padding:22px 20px 52px;border-radius:0 0 30px 30px}
header h1{margin:6px 0 4px;font-size:1.4rem}
header p{margin:0;opacity:.9;font-size:.9rem}
header a{color:#fff;font-size:.85rem;font-weight:600}
main{max-width:760px;margin:-34px auto 0;padding:0 14px 40px}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:1.05rem;color:var(--p1)}
label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:12px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;margin-top:4px;background:#fff}
button,.btn-like{display:inline-block;font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 14px;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--p1),var(--p2));text-align:center}
button.ghost{background:#f2eefc;color:var(--p1)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *{flex:1}
video{width:100%;border-radius:14px;background:#000;margin-bottom:8px}
.muted{color:var(--muted);font-size:.85rem}
.note{color:var(--bad);font-size:.85rem;min-height:1em}
.ok{color:var(--ok)}
.alert{border-left:4px solid var(--ok);background:#f0fdf7;padding:12px;border-radius:12px;font-size:.92rem}
.item{border-bottom:1px solid var(--line);padding:10px 0;font-size:.9rem}
.item:last-child{border-bottom:0}
.chip{display:inline-block;font-size:.7rem;font-weight:700;background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:999px;margin-left:6px}
.hide{display:none!important}
</style>
</head>
<body>

<header>
  <a href="https://winjher.github.io/pupae-shop-park/">← Back to the app</a>
  <h1>🔬 AI Classification</h1>
  <p>Identify a butterfly, moth, larva, pupa, or pupae defect. Each photo is saved to the matching folder in the Butterfly Dataset on Google Drive.</p>
</header>

<main>
  <!-- LOGIN -->
  <section class="card" id="loginCard">
    <h2>Log in</h2>
    <label>Username<input id="u" autocomplete="username"></label>
    <label>Password<input id="p" type="password" autocomplete="current-password"></label>
    <p class="note" id="loginMsg"></p>
    <button onclick="login()" style="width:100%">Log in</button>
  </section>

  <!-- CLASSIFIER -->
  <section class="card hide" id="appCard">
    <p class="muted">Signed in as <b id="who"></b></p>
    <label>What to identify
      <select id="task" onchange="updateClasses()"></select>
    </label>
    <div class="muted" id="taskInfo" style="margin:-4px 0 12px"></div>

    <div class="row" style="margin-bottom:10px">
      <button onclick="openCam()">📷 Use camera</button>
      <label class="btn-like" style="margin:0">📁 Upload photo
        <input type="file" accept="image/*" hidden onchange="pick(this)">
      </label>
    </div>

    <video id="cam" class="hide" autoplay playsinline muted></video>
    <div class="row hide" id="camRow" style="margin-bottom:10px">
      <button onclick="capture()">Capture</button>
      <button class="ghost" onclick="closeCam()">Cancel</button>
    </div>

    <p class="note" id="msg"></p>
    <div id="result"></div>
  </section>

  <!-- DATASET -->
  <section class="card hide" id="dsCard">
    <h2>Dataset counts</h2>
    <div id="dataset"></div>
    <button class="ghost" onclick="loadDataset()" style="width:100%;margin-top:10px">Refresh counts</button>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rpc = (fn, ...args) => new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...args));
const TASK_NAMES = {species:'Species identification', stage:'Lifecycle stage', disease:'Larval disease',
                    instar:'Larvae instar', defect:'Pupae defect', sex:'Gender (sexing)'};

let me = null, DS = {}, stream = null;

function login() {
  const u = $('u').value.trim().toLowerCase(), p = $('p').value;
  if (!u || !p) { $('loginMsg').textContent = 'Enter your username and password.'; return; }
  rpc('login', '', u, p, {}).then(r => {
    if (!r.ok) { $('loginMsg').textContent = r.msg; return; }
    me = u;
    $('who').textContent = (r.user && r.user.name) || u;
    $('loginCard').classList.add('hide');
    $('appCard').classList.remove('hide');
    $('dsCard').classList.remove('hide');
    loadDataset();
  }).catch(e => { $('loginMsg').textContent = e.message || String(e); });
}

// Reads the dataset from Drive and lists only the tasks whose folder exists
function loadDataset() {
  rpc('datasetStatus', me).then(r => {
    DS = r.dataset;
    const sel = $('task');
    const prev = sel.value;
    sel.innerHTML = '';
    Object.keys(DS).filter(k => DS[k].found).forEach(k => {
      const o = document.createElement('option');
      o.value = k; o.textContent = TASK_NAMES[k] || k;
      sel.appendChild(o);
    });
    if (prev && DS[prev] && DS[prev].found) sel.value = prev;

    $('dataset').innerHTML = Object.keys(DS).map(k => {
      const t = DS[k], labels = Object.keys(t.labels);
      return `<div class="item"><b>${esc(TASK_NAMES[k] || k)}</b>
        <span class="muted">(${esc(t.folder)})</span>${t.found ? '' : '<span class="chip">folder not found</span>'}
        <div class="muted">${labels.length ? labels.map(l => esc(l) + ': ' + t.labels[l]).join(' · ') : 'no classes yet'}</div></div>`;
    }).join('');

    if (!sel.options.length) $('msg').textContent = 'No dataset folders were found in the Butterfly Dataset folder.';
    updateClasses();
  }).catch(e => { $('msg').className = 'note'; $('msg').textContent = e.message || String(e); });
}

function updateClasses() {
  const k = $('task').value, t = DS[k];
  $('taskInfo').textContent = t ? 'Classes: ' + Object.keys(t.labels).join(', ') : '';
}

// ---- Photo input ----
function pick(input) {
  const f = input.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => toB64(reader.result).then(classify).catch(showErr);
  reader.readAsDataURL(f);
  input.value = '';
}

async function openCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}}, audio: false});
    $('cam').srcObject = stream;
    $('cam').classList.remove('hide');
    $('camRow').classList.remove('hide');
    $('msg').textContent = '';
  } catch (e) {
    showErr(new Error('The camera is not available (' + (e.name || e.message) + '). Use Upload photo instead.'));
  }
}

function capture() {
  const v = $('cam');
  if (!v.videoWidth) { $('msg').textContent = 'The camera is still starting. Try again.'; return; }
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  closeCam();
  toB64(c.toDataURL('image/jpeg', 0.92)).then(classify).catch(showErr);
}

function closeCam() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('cam').classList.add('hide');
  $('camRow').classList.add('hide');
}

// Resizes the photo and returns base64 without the data: prefix
function toB64(src, maxSide = 1024) {
  return new Promise((ok, no) => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, maxSide / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', 0.9).split(',')[1]);
    };
    im.onerror = () => no(new Error('Could not read the image.'));
    im.src = src;
  });
}

function classify(b64) {
  const task = $('task').value;
  if (!task) { $('msg').textContent = 'Choose a task first.'; return; }
  $('msg').className = 'muted';
  $('msg').textContent = 'Analyzing… this can take up to a minute.';
  $('result').innerHTML = '';
  rpc('classifyAndSave', me, {task: task, image: b64, mime: 'image/jpeg'}).then(r => {
    $('msg').className = 'ok';
    $('msg').textContent = 'Analysis complete.';
    $('result').innerHTML = `<div class="alert" ${r.identified ? '' : 'style="border-color:#f59e0b;background:#fffaf0"'}>
      <b>${r.identified ? esc(r.label) : 'Not identified (saved as Unknown)'}</b>
      · confidence ${(r.confidence * 100).toFixed(1)}%<br>
      <a href="${esc(r.fileUrl)}" target="_blank" rel="noopener">View saved photo</a> ·
      <a href="${esc(r.folderUrl)}" target="_blank" rel="noopener">Open folder</a></div>`;
    loadDataset();
  }).catch(showErr);
}

function showErr(e) {
  $('msg').className = 'note';
  $('msg').textContent = 'Classification failed: ' + (e.message || String(e));
}
</script>
</body>
</html>
